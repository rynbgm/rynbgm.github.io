<button class="btn" id="theme-toggle" style="margin-right: 15px; font-size: 14px;">
  🌓 Mode
</button>

<script>
  const themeToggle = document.getElementById('theme-toggle');
  
  let currentTheme = 'dark';
  
  themeToggle.addEventListener('click', function(e) {
    e.preventDefault();
    
    if (currentTheme === 'dark') {
      jtd.setTheme('light');
      currentTheme = 'light';
    } else {
      jtd.setTheme('dark');
      currentTheme = 'dark';
    }
  });
</script>
